name: yamllint

permissions:
  contents: read

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize, ready_for_review ]

jobs:
  yamllint-check:
    name: yaml-lint
    uses: metal3-io/project-infra/.github/workflows/yamllint.yaml@09ac46cbddaa58ae837173df520c95f85b67278c # main; zizmor: ignore[unpinned-uses]
    with:
      ref: ${{ github.event.pull_request.head.sha }}
